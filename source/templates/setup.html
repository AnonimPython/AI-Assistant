<!--
  Setup page — first-time configuration of three API keys
  Страница настройки — первоначальная конфигурация трёх API ключей
-->
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant — Setup</title>
    <link rel="icon" type="image/png" href="/static/app_img/icon.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="setup-body theme-{{ theme }}">
    <div class="setup-container">
        <div class="setup-card">
            <div class="setup-header">
                <div class="setup-orb"><span>✦</span></div>
                <h1>Welcome!</h1>
                <p class="setup-subtitle">Start with OpenRouter in one click — voice and HF keys are optional</p>
            </div>

            {% if oauth_error %}
            <div class="setup-alert">OpenRouter connection failed. Try again or paste your key manually.</div>
            {% endif %}

            <button type="button" id="oauth-start" class="setup-oauth-btn">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v4"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                </svg>
                <span>
                    <strong>Continue with OpenRouter</strong>
                    <small>1 click — no key copying, no setup</small>
                </span>
            </button>

            <div class="setup-divider"><span>or set up manually</span></div>

            <button type="button" id="open-all-keys" class="setup-allkeys-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                Open all 3 key pages
            </button>

            <form id="setup-form" class="setup-form">
                <div class="key-field">
                    <label class="key-label">
                        <span class="key-icon">[1]</span>
                        OpenRouter API Key
                    </label>
                    <input type="password" id="or_key" class="key-input" placeholder="sk-or-v1-..." required>
                    <a href="{{ links.openrouter }}" target="_blank" class="key-link">
                        Get key ->
                    </a>
                </div>

                <div class="key-field">
                    <label class="key-label">
                        <span class="key-icon">[2]</span>
                        Fish Audio API Key
                        <span class="key-optional">Optional</span>
                    </label>
                    <input type="password" id="fish_key" class="key-input" placeholder="Enter your Fish Audio key (optional)">
                    <a href="{{ links.fishaudio }}" target="_blank" class="key-link">
                        Get key ->
                    </a>
                </div>

                <div class="key-field">
                    <label class="key-label">
                        <span class="key-icon">[3]</span>
                        HuggingFace API Token
                        <span class="key-optional">Optional</span>
                    </label>
                    <input type="password" id="hf_key" class="key-input" placeholder="hf_... (optional)">
                    <a href="{{ links.huggingface }}" target="_blank" class="key-link">
                        Get token ->
                    </a>
                </div>

                <!-- Language selection -->
                <div class="key-field">
                    <label class="key-label">Language / Язык</label>
                    <div class="setup-lang-switcher">
                        <button type="button" class="setup-lang-btn active" data-lang="en">🇬🇧 English</button>
                        <button type="button" class="setup-lang-btn" data-lang="de">🇩🇪 Deutsch</button>
                        <button type="button" class="setup-lang-btn" data-lang="fr">🇫🇷 Français</button>
                        <button type="button" class="setup-lang-btn" data-lang="pt">🇵🇹 Português</button>
                        <button type="button" class="setup-lang-btn" data-lang="ru">🇷🇺 Русский</button>
                    </div>
                </div>

                <button type="submit" class="setup-btn" id="save-btn">
                    <span class="btn-text">Start using</span>
                    <span class="btn-loader" style="display:none">...</span>
                </button>
                <p id="setup-error" class="setup-error" style="display:none"></p>
            </form>
        </div>
        <div class="setup-footer">
            <a href="https://github.com/AnonimPython" target="_blank" class="github-link">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                AnonimPython
            </a>
        </div>
    </div>

    <script>
        //* Start OpenRouter OAuth from the primary setup button
        //* Запуск OpenRouter OAuth с основной кнопки настройки
        document.getElementById("oauth-start").addEventListener("click", () => {
            const btn = document.getElementById("oauth-start");
            btn.disabled = true;
            btn.querySelector("small").textContent = "Connecting to OpenRouter...";
            window.location.href = "/api/oauth/openrouter/start";
        });

        //* Open all provider key pages with one user gesture
        //* Открыть все страницы ключей одним нажатием
        document.getElementById("open-all-keys").addEventListener("click", () => {
            const pages = [
                "{{ links.openrouter }}",
                "{{ links.fishaudio }}",
                "{{ links.huggingface }}",
            ];
            for (const url of pages) {
                window.open(url, "_blank", "noopener");
            }
        });

        //* Language switcher on setup page
        //* Переключатель языка на странице настройки
        document.querySelectorAll(".setup-lang-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".setup-lang-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });

        //* Save API keys via AJAX and redirect to chat
        //* Сохранение API ключей через AJAX и переход в чат
        document.getElementById("setup-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("save-btn");
            const btnText = btn.querySelector(".btn-text");
            const loader = btn.querySelector(".btn-loader");
            const errorEl = document.getElementById("setup-error");

            const activeLang = document.querySelector(".setup-lang-btn.active");
            const lang = activeLang ? activeLang.dataset.lang : "en";

            //* Localized labels for the setup flow / Локализованные подписи мастера настройки
            const setupLabels = {
                ru: { saving: "Сохранение...", start: "Начать использовать", saveError: "Ошибка сохранения", connError: "Ошибка соединения: " },
                pt: { saving: "Salvando...", start: "Começar a usar", saveError: "Erro ao salvar", connError: "Erro de conexão: " },
            };
            const lbl = setupLabels[lang] || { saving: "Saving...", start: "Start using", saveError: "Save error", connError: "Connection error: " };

            //* Update button text based on language
            //* Меняем текст кнопки в зависимости от языка
            btnText.textContent = lbl.saving;
            loader.style.display = "inline";
            btn.disabled = true;
            errorEl.style.display = "none";

            try {
                const r = await fetch("/api/save-config", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        or_key: document.getElementById("or_key").value,
                        fish_key: document.getElementById("fish_key").value,
                        hf_key: document.getElementById("hf_key").value,
                        lang: lang,
                    }),
                });
                const data = await r.json();
                if (data.success) {
                    window.location.href = "/";
                } else {
                    errorEl.textContent = data.error || lbl.saveError;
                    errorEl.style.display = "block";
                }
            } catch (err) {
                errorEl.textContent = lbl.connError + err.message;
                errorEl.style.display = "block";
            } finally {
                btnText.textContent = lbl.start;
                loader.style.display = "none";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
